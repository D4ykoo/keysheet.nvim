<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keysheet editor</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<header>
	<span class="brand">keysheet</span>
	<span class="path">{{CONFIG_PATH}}</span>
	<label class="btn">upload config<input id="up-dir" type="file" webkitdirectory directory multiple hidden></label>
	<label class="btn">.lua files<input id="up-files" type="file" accept=".lua" multiple hidden></label>
	<label class="btn">open .json<input id="up-json" type="file" accept=".json,application/json" hidden></label>
	<span class="sep"></span>
	<button id="exp-svg">SVG</button>
	<button id="exp-png1">PNG 1x</button>
	<button id="exp-png2">2x</button>
	<button id="exp-png4">4x</button>
	<button id="exp-html">HTML</button>
	<button id="exp-pdf">PDF</button>
	<button id="exp-json">JSON</button>
	<span class="sep"></span>
	<button id="save" class="primary">Save</button>
	<span id="saved" class="saved"></span>
</header>

<main>
	<div id="editor"></div>
	<div id="preview">loading…</div>
</main>
<div id="warnbar"></div>

<script src="/editor.js"></script>
</body>
</html>
