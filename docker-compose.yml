# Run the keysheet editor with a persisted keymaps.json.
#
#   docker compose up --build        # build locally and run
#   docker compose up -d             # detached
#
# To run the published image instead of building locally, comment out `build`
# and uncomment `image` below.
services:
  keysheet:
    build: .
    image: ghcr.io/d4ykoo/keysheet.nvim:latest
    ports:
      - "4711:4711"
    environment:
      # PORT is the in-container port; keep it aligned with the mapping above.
      PORT: "4711"
      HOST: "0.0.0.0"
    volumes:
      # Persist edits made via the editor's Save button across restarts.
      - ./keymaps.json:/app/keymaps.json
    restart: unless-stopped
